# Déploiement du dashboard (dossier web/) sur Netlify.
# Le repo est déjà lié dans Netlify ; ce fichier suffit, ne rien saisir dans l'UI.
# Build lancé depuis la racine du repo (pas de "base") pour éviter toute ambiguïté
# sur le chemin de publication.

[build]
  command = "npm --prefix web ci && npm --prefix web run build"
  publish = "web/dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
